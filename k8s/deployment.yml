apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-fixit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-fixit
  template:
    metadata:
      labels:
        app: campus-fixit
    spec:
      containers:
        - name: backend
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 7224
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: campus-fixit-config
                  key: PORT
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
