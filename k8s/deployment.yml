apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-fixit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-fixit
  template:
    metadata:
      labels:
        app: campus-fixit
    spec:
      containers:
        - name: backend
          image: IMAGE_PLACEHOLDER  # Will be replaced by kubectl set image
          ports:
            - containerPort: 7224
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: campus-fixit-config
                  key: PORT
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: campus-fixit-secrets
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: campus-fixit-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /
              port: 7224
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 7224
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
