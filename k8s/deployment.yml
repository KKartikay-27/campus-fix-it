apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-fixit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-fixit
  template:
    metadata:
      labels:
        app: campus-fixit
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: backend
          image: IMAGE_PLACEHOLDER  # Will be replaced by kubectl set image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7224
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: campus-fixit-config
                  key: PORT
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /
              port: 7224
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /
              port: 7224
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: 7224
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            readOnlyRootFilesystem: false
