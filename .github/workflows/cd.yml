name: CD Pipeline - Kubernetes Deployment

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main, master]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/campus-fixit-backend

jobs:

  # ===============================
  # Stage 1: Build & Deploy to SIT (KIND)
  # ===============================
  deploy-sit:
    name: Build Docker Image & Deploy to SIT (Kubernetes)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      # -------------------------------
      # Artifactory: Pull image from Docker Hub (artifact pickup)
      # -------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image from registry
        run: docker pull $IMAGE_NAME:latest

      # -------------------------------
      # Install kubectl
      # -------------------------------
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      # -------------------------------
      # Install KIND
      # -------------------------------
      - name: Install KIND
        run: |
          curl -Lo kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      # -------------------------------
      # Create SIT Cluster
      # -------------------------------
      - name: Create KIND Cluster
        run: kind create cluster --name sit

      # -------------------------------
      # Load Docker image into KIND
      # -------------------------------
      - name: Load image into KIND
        run: kind load docker-image $IMAGE_NAME:latest --name sit

      # -------------------------------
      # Create/Update SIT Secrets in cluster
      # -------------------------------
      - name: Apply SIT secrets
        run: |
          kubectl create secret generic campus-fixit-secrets \
            --from-literal=MONGO_URI="${{ secrets.MONGO_URI_SIT }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET_SIT }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # -------------------------------
      # Deploy to Kubernetes
      # -------------------------------
      - name: Deploy to SIT
        run: |
          set -o pipefail
          deploy_and_wait() {
            kubectl apply -f k8s/configmap.yml
            kubectl apply -f k8s/deployment.yml
            kubectl apply -f k8s/service.yml
            kubectl set image deployment/campus-fixit backend=$IMAGE_NAME:latest
            echo "--- Pods after apply ---"
            kubectl get pods -o wide
            echo "--- Waiting for rollout ---"
            kubectl rollout status deployment/campus-fixit --timeout=300s
            kubectl wait --for=condition=available deployment/campus-fixit --timeout=180s
          }
          diagnostics() {
            echo "\n===== DIAGNOSTICS: Deployment/Pods/Events ====="
            kubectl describe deployment campus-fixit || true
            kubectl get pods -o wide || true
            for p in $(kubectl get pods -o name | grep campus-fixit || true); do
              echo "\n---- logs for $p ----"
              kubectl logs $p --tail=200 || true
              echo "\n---- describe $p ----"
              kubectl describe $p || true
            done
            echo "\n---- Events ----"
            kubectl get events --sort-by=.lastTimestamp | tail -n 100 || true
          }
          if ! deploy_and_wait; then
            echo "❌ Rollout failed. Gathering diagnostics..."
            diagnostics
            exit 1
          fi
          echo "✅ SIT deployment available."

      # -------------------------------
      # Simple Performance Test (dummy)
      # -------------------------------
      - name: Port-forward service for tests
        run: |
          kubectl get svc campus-fixit-service
          nohup kubectl port-forward svc/campus-fixit-service 7224:7224 >/tmp/pf.log 2>&1 &
          echo $! > /tmp/pf.pid
          # Wait for readiness
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:7224/ || true)
            if [ "$code" = "200" ]; then echo "Service is reachable"; break; fi
            sleep 2
          done

      - name: Basic load probe
        run: |
          echo "Running basic performance validation..."
          for i in {1..10}; do
            curl -s -o /dev/null -w "Request #%{num_connects} time_total=%{time_total}\n" http://localhost:7224/ || true
          done
          echo "✔ Performance probe completed"

      # -------------------------------
      # Dummy DAST (placeholder)
      # -------------------------------
      - name: Dummy DAST
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:7224
          fail_action: false

      - name: Cleanup port-forward
        if: always()
        run: |
          kill $(cat /tmp/pf.pid) 2>/dev/null || true

  # ===============================
  # Stage 2: NLP Integration (Optional Placeholder)
  # ===============================
  nlp-integration:
    name: NLP Integration (Optional)
    runs-on: ubuntu-latest
    needs: deploy-sit

    steps:
      - name: NLP Placeholder
        run: |
          echo "NLP integration placeholder"
          echo "✔ NLP stage skipped safely"
