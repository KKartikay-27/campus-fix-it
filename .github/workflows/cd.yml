name: CD Pipeline - Kubernetes Deployment

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main, master]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/campus-fixit-backend

jobs:

  # ===============================
  # Stage 1: Build & Deploy to SIT (KIND)
  # ===============================
  deploy-sit:
    name: Build Docker Image & Deploy to SIT (Kubernetes)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      # -------------------------------
      # Build Docker Image locally
      # -------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:latest ./backend

      # -------------------------------
      # Install kubectl
      # -------------------------------
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      # -------------------------------
      # Install KIND
      # -------------------------------
      - name: Install KIND
        run: |
          curl -Lo kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      # -------------------------------
      # Create SIT Cluster
      # -------------------------------
      - name: Create KIND Cluster
        run: kind create cluster --name sit

      # -------------------------------
      # Load Docker image into KIND
      # -------------------------------
      - name: Load image into KIND
        run: kind load docker-image $IMAGE_NAME:latest --name sit

      # -------------------------------
      # Deploy to Kubernetes
      # -------------------------------
      - name: Deploy to SIT
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
          kubectl set image deployment/campus-fixit backend=$IMAGE_NAME:latest
          kubectl rollout status deployment/campus-fixit

  # ===============================
  # Stage 2: Performance Testing
  # ===============================
  performance-test:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: deploy-sit

    steps:
      - name: Dummy Load Test
        run: |
          echo "Running basic performance validation..."
          sleep 5
          echo "✔ Performance test passed"

  # ===============================
  # Stage 3: Security Testing (DAST)
  # ===============================
  security-test:
    name: Security Testing (DAST)
    runs-on: ubuntu-latest
    needs: performance-test

    steps:
      - name: Dummy DAST Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:7224
          fail_action: false

  # ===============================
  # Stage 4: NLP Integration (Optional)
  # ===============================
  nlp-integration:
    name: NLP Integration (Optional)
    runs-on: ubuntu-latest
    needs: security-test

    steps:
      - name: NLP Placeholder
        run: |
          echo "NLP integration placeholder"
          echo "✔ NLP stage skipped safely"
