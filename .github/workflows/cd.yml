name: CD Pipeline - AWS Deployment

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: sit
        type: choice
        options: [sit, performance, security, production]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/campus-fixit-backend
  AWS_REGION: us-east-1

jobs:
  artifactory:
    name: Artifactory - Retrieve Artifact
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - run: docker pull ${{ env.IMAGE_NAME }}:latest

  deploy-sit:
    name: Deploy to SIT
    runs-on: ubuntu-latest
    needs: artifactory
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_SIT_HOST }}
          username: ${{ secrets.EC2_SIT_USER }}
          key: ${{ secrets.EC2_SIT_SSH_KEY }}
          script: |
            sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            sudo docker pull ${{ env.IMAGE_NAME }}:latest
            sudo docker stop campus-fixit-sit || true
            sudo docker rm campus-fixit-sit || true
            sudo docker run -d \
              --name campus-fixit-sit \
              --restart unless-stopped \
              -p 7224:7224 \
              -e MONGO_URI="${{ secrets.MONGO_URI_SIT }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET_SIT }}" \
              -e PORT=7224 \
              ${{ env.IMAGE_NAME }}:latest

  performance-test:
    name: Performance Test + Deploy
    runs-on: ubuntu-latest
    needs: deploy-sit
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PERFORMANCE_HOST }}
          username: ${{ secrets.EC2_PERFORMANCE_USER }}
          key: ${{ secrets.EC2_PERFORMANCE_SSH_KEY }}
          script: |
            sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            sudo docker pull ${{ env.IMAGE_NAME }}:latest
            sudo docker stop campus-fixit-performance || true
            sudo docker rm campus-fixit-performance || true
            sudo docker run -d \
              --name campus-fixit-performance \
              --restart unless-stopped \
              -p 7225:7224 \
              -e MONGO_URI="${{ secrets.MONGO_URI_PERFORMANCE }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET_PERFORMANCE }}" \
              -e PORT=7224 \
              ${{ env.IMAGE_NAME }}:latest

  security-test:
    name: Security Deploy
    runs-on: ubuntu-latest
    needs: performance-test
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_SECURITY_HOST }}
          username: ${{ secrets.EC2_SECURITY_USER }}
          key: ${{ secrets.EC2_SECURITY_SSH_KEY }}
          script: |
            sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            sudo docker pull ${{ env.IMAGE_NAME }}:latest
            sudo docker stop campus-fixit-security || true
            sudo docker rm campus-fixit-security || true
            sudo docker run -d \
              --name campus-fixit-security \
              --restart unless-stopped \
              -p 7226:7224 \
              -e MONGO_URI="${{ secrets.MONGO_URI_SECURITY }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET_SECURITY }}" \
              -e PORT=7224 \
              ${{ env.IMAGE_NAME }}:latest

  production:
    name: Production Deploy
    runs-on: ubuntu-latest
    needs: security-test
    if: ${{ github.event.inputs.environment == 'production' }}
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PRODUCTION_HOST }}
          username: ${{ secrets.EC2_PRODUCTION_USER }}
          key: ${{ secrets.EC2_PRODUCTION_SSH_KEY }}
          script: |
            sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            sudo docker pull ${{ env.IMAGE_NAME }}:latest
            sudo docker stop campus-fixit-production || true
            sudo docker rm campus-fixit-production || true
            sudo docker run -d \
              --name campus-fixit-production \
              --restart unless-stopped \
              -p 7224:7224 \
              -e MONGO_URI="${{ secrets.MONGO_URI_PRODUCTION }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET_PRODUCTION }}" \
              -e PORT=7224 \
              ${{ env.IMAGE_NAME }}:latest
