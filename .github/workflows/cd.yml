name: CD Pipeline - Kubernetes Deployment

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main, master]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/campus-fixit-backend

jobs:

  # ===============================
  # Stage 1: Artifactory
  # ===============================
  artifactory:
    name: Retrieve Trusted Image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image locally
        run: |
          docker build -t $IMAGE_NAME:latest ./backend

  # ===============================
  # Stage 2: Deploy to SIT (K8s with KIND)
  # ===============================
  deploy-sit:
    name: Deploy to SIT (Kubernetes)
    runs-on: ubuntu-latest
    needs: artifactory
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install KIND
        run: |
          curl -Lo kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Create SIT Cluster
        run: kind create cluster --name sit

      - name: Load image into SIT
        run: kind load docker-image $IMAGE_NAME:latest --name sit

      - name: Deploy to SIT
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml

          kubectl set image deployment/campus-fixit \
            backend=$IMAGE_NAME:latest

          kubectl rollout status deployment/campus-fixit

  # ===============================
  # Stage 3: Performance Testing
  # ===============================
  performance-test:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: deploy-sit
    steps:
      - name: Dummy Load Test
        run: |
          echo "Running basic performance validation"
          sleep 5
          echo "✔ Performance test passed"

  # ===============================
  # Stage 4: Security Testing (DAST)
  # ===============================
  security-test:
    name: Security Testing (DAST)
    runs-on: ubuntu-latest
    needs: performance-test
    steps:
      - name: Dummy DAST Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://example.com
          fail_action: false

  # ===============================
  # Stage 5: NLP Integration (Optional)
  # ===============================
  nlp-integration:
    name: NLP Integration (Optional)
    runs-on: ubuntu-latest
    needs: security-test
    steps:
      - name: NLP Placeholder
        run: |
          echo "NLP integration placeholder"
          echo "✔ NLP stage skipped safely"
