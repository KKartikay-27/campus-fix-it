name: CD Pipeline - Kubernetes Deployment

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main, master]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/campus-fixit-backend

jobs:

  # ===============================
  # Stage 1: Build & Deploy to SIT (KIND)
  # ===============================
  deploy-sit:
    name: Build Docker Image & Deploy to SIT (Kubernetes)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      # -------------------------------
      # Artifactory: Pull image from Docker Hub (artifact pickup)
      # -------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image from registry
        run: docker pull $IMAGE_NAME:latest

      # -------------------------------
      # Install kubectl
      # -------------------------------
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      # -------------------------------
      # Install KIND
      # -------------------------------
      - name: Install KIND
        run: |
          curl -Lo kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      # -------------------------------
      # Create SIT Cluster
      # -------------------------------
      - name: Create KIND Cluster
        run: kind create cluster --name sit

      - name: Verify cluster is Ready
        run: |
          kubectl config current-context
          kubectl cluster-info
          echo "Waiting for nodes to be Ready..."
          kubectl wait --for=condition=Ready nodes --all --timeout=120s
          echo "Nodes:"
          kubectl get nodes -o wide
          echo "Kube-system pods:"
          kubectl get pods -n kube-system

      # -------------------------------
      # Load Docker image into KIND
      # -------------------------------
      - name: Load image into KIND
        run: kind load docker-image $IMAGE_NAME:latest --name sit

      - name: Verify image present in KIND node
        run: |
          echo "Images in container runtime (crictl) inside sit-control-plane:"
          docker exec sit-control-plane crictl images | head -n 5 || true
          echo "Searching for $IMAGE_NAME:latest in node images:"
          if docker exec sit-control-plane crictl images | grep -q "${IMAGE_NAME}.*latest"; then
            echo "✅ Image present in KIND node runtime"
          else
            echo "❌ Image not visible in KIND node runtime; reloading"
            kind load docker-image $IMAGE_NAME:latest --name sit
            docker exec sit-control-plane crictl images | grep "${IMAGE_NAME}.*latest" || (echo "❌ Still not present" && exit 1)
          fi

      # -------------------------------
      # Create/Update SIT Secrets in cluster
      # -------------------------------
      - name: Apply SIT secrets
        run: |
          kubectl create secret generic campus-fixit-secrets \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET_SIT }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # -------------------------------
      # Deploy to Kubernetes
      # -------------------------------
      - name: Deploy to SIT
        run: |
          set -o pipefail
          deploy_and_wait() {
            kubectl apply -f k8s/configmap.yml
            kubectl apply -f k8s/service.yml
            # Apply deployment, immediately scale to 0 to avoid starting placeholder image
            kubectl apply -f k8s/deployment.yml
            kubectl scale deployment/campus-fixit --replicas=0
            # Ensure no pods are running from the placeholder ReplicaSet
            kubectl delete pods -l app=campus-fixit --ignore-not-found
            # Set the correct image and scale up to 1
            kubectl set image deployment/campus-fixit backend=$IMAGE_NAME:latest
            kubectl scale deployment/campus-fixit --replicas=1
            echo "--- Objects after apply (deploy/rs/pods) ---"
            kubectl get deploy,rs,pods -o wide || true
            echo "--- Recent events ---"
            kubectl get events --sort-by=.lastTimestamp | tail -n 20 || true
            echo "Sleeping 5s to allow scheduler to create pods..."
            sleep 5
            echo "--- Checking pod creation status ---"
            # If pods are stuck in ContainerCreating for too long, show describe and fail early
            for i in {1..30}; do
              kubectl get pods -l app=campus-fixit -o wide || true
              phase=$(kubectl get pods -l app=campus-fixit --no-headers 2>/dev/null | awk '{print $3}' | tr '\n' ' ')
              creating=$(echo "$phase" | grep -c ContainerCreating || true)
              running=$(echo "$phase" | grep -c Running || true)
              cfgerr=$(echo "$phase" | grep -c CreateContainerConfigError || true)
              if [ "$running" -ge 1 ]; then
                echo "Pod is running, continuing to rollout wait."
                break
              fi
              if [ "$cfgerr" -ge 1 ]; then
                echo "❌ Pod in CreateContainerConfigError. Dumping describe and exiting."
                for p in $(kubectl get pods -l app=campus-fixit -o name); do
                  kubectl describe $p || true
                done
                exit 1
              fi
              if [ "$i" -eq 30 ] && [ "$creating" -ge 1 ]; then
                echo "❌ Pod stuck in ContainerCreating. Dumping describe and exiting."
                for p in $(kubectl get pods -l app=campus-fixit -o name); do
                  kubectl describe $p || true
                done
                exit 1
              fi
              sleep 2
            done
            echo "--- Waiting for rollout ---"
            kubectl rollout status deployment/campus-fixit --timeout=300s
            kubectl wait --for=condition=available deployment/campus-fixit --timeout=180s
          }
          diagnostics() {
            echo "\n===== DIAGNOSTICS: Deployment/Pods/Events ====="
            kubectl describe deployment campus-fixit || true
            kubectl get pods -o wide || true
            for p in $(kubectl get pods -o name | grep campus-fixit || true); do
              echo "\n---- logs for $p ----"
              kubectl logs $p --tail=200 || true
              echo "\n---- describe $p ----"
              kubectl describe $p || true
            done
            echo "\n---- Events ----"
            kubectl get events --sort-by=.lastTimestamp | tail -n 100 || true
          }
          if ! deploy_and_wait; then
            echo "❌ Rollout failed. Gathering diagnostics..."
            diagnostics
            exit 1
          fi
          echo "✅ SIT deployment available."

      # -------------------------------
      # Simple Performance Test (dummy)
      # -------------------------------
      - name: Port-forward service for tests
        run: |
          kubectl get svc campus-fixit-service
          nohup kubectl port-forward svc/campus-fixit-service 7224:7224 >/tmp/pf.log 2>&1 &
          echo $! > /tmp/pf.pid
          # Wait for readiness
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:7224/ || true)
            if [ "$code" = "200" ]; then echo "Service is reachable"; break; fi
            sleep 2
          done

      - name: Basic load probe
        run: |
          echo "Running basic performance validation..."
          for i in {1..10}; do
            curl -s -o /dev/null -w "Request #%{num_connects} time_total=%{time_total}\n" http://localhost:7224/ || true
          done
          echo "✔ Performance probe completed"

      # -------------------------------
      # Dummy DAST (placeholder)
      # -------------------------------
      - name: Dummy DAST
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:7224
          fail_action: false

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-reports
          path: |
            report_html.html
            report_md.md
            report_json.json
          retention-days: 14

      - name: Cleanup port-forward
        if: always()
        run: |
          kill $(cat /tmp/pf.pid) 2>/dev/null || true

  # ===============================
  # Stage 2: NLP Integration (Optional Placeholder)
  # ===============================
  nlp-integration:
    name: NLP Integration (Optional)
    runs-on: ubuntu-latest
    needs: deploy-sit

    steps:
      - name: NLP Placeholder
        run: |
          echo "NLP integration placeholder"
          echo "✔ NLP stage skipped safely"
